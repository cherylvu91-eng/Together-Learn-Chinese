name: Auto convert vocab Excel to JSON

on:
  push:
    branches: [main]
    paths:
      - "vocab_data.xlsx"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Convert Excel to JSON
        run: python convert_excel_to_json.py vocab_data.xlsx data/vocab.json

      - name: Commit updated vocab.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vocab.json
          git diff --cached --quiet && echo "Không có thay đổi" || git commit -m "Tu dong cap nhat vocab.json tu Excel"
          git push
